<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>卡通戰爭 · 原型 v1.4.9</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    height: 100dvh;
    background: #1a1520;
    color: #fff;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #2a2235;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .stat {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .stat span { color: #ffd54a; }
  .gold-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex-shrink: 0;
    display: block;
  }
  .stat-meta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .streak-badge-wrap {
    position: relative;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: none;
  }
  .streak-badge-wrap.show { display: inline-block; }
  .streak-badge-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .streak-badge-wrap .streak-num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #ffd54a;
    text-shadow: 0 1px 2px #000;
    pointer-events: none;
    line-height: 1;
  }
  #hpBar {
    flex: 1;
    display: flex;
    gap: 6px;
    align-items: center;
    min-width: 120px;
  }
  .hp {
    flex: 1;
    height: 14px;
    background: #3a3045;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
  }
  .hp > i {
    display: block;
    height: 100%;
    width: 100%;
    transform-origin: left center;
    transition: transform 0.2s;
  }
  #pHp > i { background: linear-gradient(90deg, #4caf50, #8bc34a); }
  #eHp > i { background: linear-gradient(90deg, #ef5350, #ff7043); transform-origin: right center; }
  .hp-label { font-size: 11px; opacity: 0.85; min-width: 28px; }
  .hud-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .hud-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 40px;
    touch-action: manipulation;
    white-space: nowrap;
    background: #4a3f5c;
  }
  .hud-btn:active { transform: translateY(1px); }
  .hud-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #btnGoldBoost { background: #c9a227; color: #1a1520; }
  #btnMute.on { background: #666; }
  #stageWrap {
    flex: 1;
    position: relative;
    min-height: 0;
    background: linear-gradient(180deg, #b8e4f8 0%, #b8e4f8 55%, #6bbf5a 55%, #5aad4a 100%); /* v1.4.9 CW3 sky */
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr) auto;
    gap: 8px;
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px));
    background: #2a2235;
    flex-shrink: 0;
  }
  button.unit {
    border: none;
    border-radius: 14px;
    padding: 8px 4px 10px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 72px;
    line-height: 1.15;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    touch-action: manipulation;
  }
  button.unit:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  button.unit:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .unit-icon {
    display: block;
    width: 36px;
    height: 36px;
    font-size: 26px;
    line-height: 36px;
    text-align: center;
    object-fit: contain;
    pointer-events: none;
  }
  .unit-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .unit-name { font-size: 13px; font-weight: 800; }
  #btnSword { background: #3d7ea6; }
  #btnArcher { background: #6a8f3d; }
  #btnGiant { background: #a65c3d; }
  #btnBomber { background: #7b4aa6; }
  #btnRestart {
    background: #555;
    border: none;
    border-radius: 14px;
    padding: 12px 12px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    min-height: 72px;
    white-space: nowrap;
    touch-action: manipulation;
  }
  #btnRestart:active { transform: translateY(2px); }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
    padding: 24px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay.win #endTitle { color: #81c784; }
  #overlay.lose #endTitle { color: #ef9a9a; }
  #overlay h1 {
    font-size: clamp(32px, 8vw, 44px);
    text-shadow: 0 2px 12px #000;
    font-weight: 900;
  }
  #endSub {
    font-size: 15px;
    opacity: 0.9;
    max-width: 300px;
    line-height: 1.45;
  }
  #endCard {
    position: relative;
    width: min(900px, 94vw);
    max-width: 900px;
    aspect-ratio: 900 / 520;
    background-color: #1a1520;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    border: none;
    border-radius: 18px;
    padding: 0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  #overlay.win #endCard { background-image: var(--end-win); }
  #overlay.lose #endCard { background-image: var(--end-lose); }
  #endCard .end-title-vis {
    position: absolute;
    left: 0; right: 0;
    top: 8.5%;
    height: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #endCard #endTitle {
    font-size: clamp(22px, 5.5vw, 40px);
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  #endCard #endSub {
    display: none;
  }
  #endBody {
    position: absolute;
    left: 10%;
    right: 10%;
    top: 29%;
    height: 28%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(10, 8, 16, 0.55);
    border-radius: 12px;
    padding: 8px 12px;
    text-align: center;
  }
  #endStats {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 0;
    font-size: clamp(13px, 2.8vw, 18px);
    font-weight: 800;
  }
  #endStats span { color: #ffd54a; }
  #endRecord {
    font-size: clamp(12px, 2.4vw, 15px);
    opacity: 0.95;
    margin: 0;
    font-weight: 700;
  }
  #endTip {
    font-size: clamp(10px, 2vw, 12px);
    opacity: 0.8;
    line-height: 1.35;
    margin: 2px 0 0;
    max-width: 100%;
  }
  #endNextUnlock {
    font-size: clamp(10px, 2vw, 12px);
    opacity: 0.9;
    line-height: 1.35;
    margin: 4px 0 0;
    max-width: 100%;
    color: #ffe082;
  }
  #endCard #btnAgain {
    position: absolute;
    left: 17.8%;
    width: 64.4%;
    top: 63.5%;
    height: 26.5%;
    margin: 0;
    min-height: 0;
    min-width: 0;
    max-width: none;
    padding: 0;
    border-radius: 14px;
    font-size: clamp(18px, 4.5vw, 28px);
    background: transparent;
    color: transparent;
    box-shadow: none;
    border: none;
    cursor: pointer;
  }
  #endCard #btnAgain:active { transform: scale(0.98); box-shadow: none; }
  #overlay button#btnAgain { /* keep touch */ touch-action: manipulation; }
  #matchTip {
    font-size: 11px;
    opacity: 0.72;
    text-align: center;
    padding: 4px 10px 0;
    background: #2a2235;
    flex-shrink: 0;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  .stat-meta {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.9;
    white-space: nowrap;
  }
  .stat-meta span { color: #ffd54a; }
  #overlay button:not(#btnAgain) {
    background: #ffd54a;
    color: #1a1520;
    border: none;
    border-radius: 18px;
    padding: 18px 40px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    min-height: 72px;
    min-width: min(280px, 86vw);
    width: 100%;
    max-width: 300px;
    margin-top: 14px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    touch-action: manipulation;
  }
  #overlay button:not(#btnAgain):active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .cost { display: block; font-size: 12px; font-weight: 600; opacity: 0.95; margin-top: 2px; }
  #cdHint {
    font-size: 11px;
    opacity: 0.7;
    text-align: center;
    grid-column: 1 / -1;
    margin-top: -4px;
    min-height: 14px;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #hud { padding: 4px 8px; }
    .hud-btn { min-height: 36px; padding: 6px 8px; font-size: 11px; }
    #controls {
      gap: 6px;
      padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    button.unit, #btnRestart { min-height: 60px; padding: 4px 2px; }
    .unit-icon { width: 26px; height: 26px; font-size: 20px; line-height: 26px; }
    .unit-name { font-size: 12px; }
    .cost { font-size: 11px; }
  }
  /* 窄屏：出兵掣兩行 2×2，重開另列，避免重疊／撳唔到 */
  @media (max-width: 420px) {
    #controls {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 10px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    button.unit {
      min-height: 68px;
      padding: 6px 2px 8px;
    }
    .unit-icon { width: 32px; height: 32px; font-size: 22px; line-height: 32px; }
    .unit-name { font-size: 12px; }
    .cost { font-size: 11px; }
    #btnRestart {
      grid-column: 1 / -1;
      min-height: 48px;
      padding: 10px 8px;
      font-size: 14px;
    }
    #cdHint { grid-column: 1 / -1; }
  }
  @media (max-width: 360px) {
    .unit-name { font-size: 11px; }
    .cost { font-size: 10px; }
    button.unit { min-height: 64px; }
  }


  #hud .hud-meta { display:flex; gap:6px; align-items:center; font-size:12px; opacity:0.9; }
  #hud .hud-meta span { white-space:nowrap; }
  .hud-btn.off { opacity:0.55; }
  .unit { position:relative; }
  .unit-lv-badge {
    position:absolute; top:4px; right:4px;
    font-size:10px; font-weight:700; background:rgba(0,0,0,0.45);
    padding:1px 5px; border-radius:8px; line-height:1.3;
  }
  .unit.locked { opacity:0.45; filter:grayscale(0.6); }
  #unitSlots {
    display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1;
  }
  #sideActions {
    display:flex; flex-direction:column; gap:6px; min-width:72px;
  }
  #sideActions .hud-btn { width:100%; font-size:11px; padding:8px 6px; line-height:1.25; }
  #preBattle {
    position:absolute; inset:0; z-index:20;
    background:rgba(12,10,18,0.92);
    display:none; flex-direction:column; align-items:center;
    justify-content:flex-start; padding:16px 14px 24px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #preBattle.show { display:flex; }
  #preBattle h2 { font-size:18px; margin:4px 0 10px; }
  #preBattle .pb-sec { width:100%; max-width:420px; margin-bottom:14px; }
  #preBattle .pb-sec h3 { font-size:13px; opacity:0.85; margin-bottom:8px; }
  .loadout-slots { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .loadout-slot {
    min-height:48px; border:1.5px dashed rgba(255,255,255,0.35);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:13px; background:rgba(255,255,255,0.04); cursor:pointer;
  }
  .loadout-slot.filled {
    border-style:solid; border-color:rgba(129,199,132,0.7);
    background:rgba(76,175,80,0.15);
  }
  .unit-pool { display:flex; flex-wrap:wrap; gap:6px; }
  .pool-btn {
    border:0; border-radius:8px; padding:8px 10px; font-size:12px;
    background:#3d3550; color:#fff; cursor:pointer;
  }
  .pool-btn.in { outline:2px solid #81c784; }
  .pool-btn.locked { opacity:0.45; }
  .br-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.08); font-size:13px;
  }
  .br-row button {
    border:0; border-radius:8px; padding:6px 10px; font-size:11px;
    background:#5c6bc0; color:#fff; cursor:pointer;
  }
  .br-row button:disabled { opacity:0.45; }
  #btnStartMatch {
    margin-top:8px; width:100%; max-width:420px; border:0; border-radius:12px;
    padding:14px; font-size:16px; font-weight:700; background:#66bb6a; color:#fff;
    cursor:pointer;
  }
  #toast {
    position:absolute; left:50%; bottom:18%; transform:translateX(-50%) translateY(12px);
    background:rgba(0,0,0,0.75); color:#fff; padding:8px 14px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:30; max-width:90%; text-align:center;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #endMeta { margin-top:6px; font-size:12px; opacity:0.85; }
  #controls { display:flex; gap:8px; align-items:stretch; padding:8px 10px 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }


  .unit-icon { position:relative; display:inline-flex; align-items:center; justify-content:center; }
  .unit-icon img { display:block; }
  .unit-lock-overlay {
    position:absolute; inset:0; margin:auto; width:22px; height:22px;
    pointer-events:none; opacity:0.92;
  }
  .unit-lv-badge {
    background-image: var(--lv-badge-empty);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-color: transparent;
    min-width: 22px; text-align: center;
    padding: 2px 4px;
  }
  #castleLvHud {
    display:inline-flex; align-items:center; gap:4px;
  }
  #castleLvHud .castle-lv-flag {
    width:18px; height:18px; display:inline-block; vertical-align:middle;
  }
  .loadout-slots {
    background-image: var(--loadout-frame);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 10px;
    border-radius: 12px;
    gap: 10px;
  }
  .loadout-slot {
    background-image: var(--loadout-slot);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border: none;
    min-height: 56px;
    gap: 6px;
    flex-direction: column;
  }
  .loadout-slot img.slot-icon { width:28px; height:28px; display:block; }
  .pool-btn { position:relative; display:inline-flex; align-items:center; gap:6px; }
  .pool-btn img.pool-icon { width:22px; height:22px; display:block; }
  .pool-btn img.pool-lock {
    position:absolute; right:4px; top:4px; width:16px; height:16px; opacity:0.9;
  }

</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><img class="gold-icon" id="goldIcon" alt="" width="22" height="22" /><span id="gold">0</span></div>
    <div class="stat-meta" title="連勝／總勝場">
      <span class="streak-badge-wrap" id="streakBadgeWrap" aria-hidden="true">
        <img id="streakBadgeImg" alt="" width="36" height="36" />
        <span class="streak-num" id="streakBadgeNum">0</span>
      </span>
      連<span id="streakHud">0</span> · 勝<span id="winsHud">0</span>
    </div>
    <div class="hud-meta">
      <span id="castleLvHud">城 Lv.1/5</span>
      <span id="metaGoldHud">★0</span>
    </div>
    <div id="hpBar">
      <span class="hp-label">我方</span>
      <div class="hp" id="pHp"><i id="pHpFill"></i></div>
      <div class="hp" id="eHp"><i id="eHpFill"></i></div>
      <span class="hp-label">敵方</span>
    </div>
    <div class="hud-actions">
      <button type="button" class="hud-btn" id="btnGoldBoost" title="永久 +30% 產金">加速產金 · 200</button>
      <button type="button" class="hud-btn" id="btnMute" title="音效開關">音效開</button>
    </div>
  </div>
  <div id="matchTip">城攻清線 · 升城／升兵 · 編隊四格 · 勝場解鎖</div>
  <div id="stageWrap">
    <canvas id="c"></canvas>
    <div id="toast" role="status"></div>
    <div id="preBattle" aria-label="戰前編隊">
      <h2>編隊開戰</h2>
      <div class="pb-sec">
        <h3>出戰欄（最多 4 · 點空位旁候選加入，點已選移除）</h3>
        <div class="loadout-slots" id="loadoutSlots"></div>
      </div>
      <div class="pb-sec">
        <h3>已解鎖兵種</h3>
        <div class="unit-pool" id="unitPool"></div>
      </div>
      <div class="pb-sec">
        <h3>兵營（永久升級 · ★<span id="brMetaGold">0</span>）</h3>
        <div id="barracksRows"></div>
      </div>
      <button type="button" id="btnStartMatch">確認編隊 · 開戰</button>
    </div>
    <div id="overlay">
      <div id="endCard">
        <h1 id="endTitle"></h1>
        <p id="endSub"></p>
        <div id="endBody">
          <div id="endStats">擊殺 <span id="endKills">0</span> · 用時 <span id="endTime">0:00</span></div>
          <div id="endRecord">連勝 <span id="endStreak">0</span> · 總勝 <span id="endWins">0</span></div>
          <div id="endMeta"></div>
          <p id="endTip">城攻清線 · 升城／升兵 · 編隊四格 · 勝場解鎖</p>
          <p id="endNextUnlock"></p>
        </div>
        <button type="button" id="btnAgain" aria-label="再開一局">改編隊再開</button>
      </div>
    </div>
  </div>
  <div id="controls">
    <div id="unitSlots"></div>
    <div id="sideActions">
      <button type="button" class="hud-btn" id="btnCastleAtk" title="城堡攻擊開關">城攻開</button>
      <button type="button" class="hud-btn" id="btnCastleUp" title="局內升城">城 LV↑</button>
      <button type="button" class="hud-btn" id="btnRestart" title="回編隊">編隊</button>
    </div>
  </div>
  <p id="cdHint"></p>
</div>
<script>


  const UNIT_DEFS = {
    sword: {
      name: '劍士', cost: 50, hp: 80, dmg: 12, speed: 55, radius: 14, height: 28,
      color: '#4fc3f7', range: 22, explodeRadius: 0, explodeDmg: 0,

    })(),
    ctx: null,
    _noiseBuf: null,
    ensure: function () {
      if (!this.ctx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        try { this.ctx.resume(); } catch (e) {}
      }
      if (this.ctx && !this._noiseBuf) {
        try {
          const len = Math.floor(this.ctx.sampleRate * 0.08);
          const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
          this._noiseBuf = buf;
        } catch (e) {}
      }
    },
    _tone: function (type, freq, dur, vol, endFreq) {
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      if (endFreq != null && endFreq > 0) {
        try { o.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 20), now + dur); } catch (e) {
          o.frequency.linearRampToValueAtTime(endFreq, now + dur);
        }
      }
      g.gain.setValueAtTime(Math.max(vol, 0.0001), now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g);
      g.connect(this.ctx.destination);
      o.start(now);
      o.stop(now + dur + 0.02);
    },
    _noise: function (dur, vol, filterFreq) {
      if (!this._noiseBuf) return;
      const now = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this._noiseBuf;
      const g = this.ctx.createGain();
      let node = src;
      if (filterFreq) {
        try {
          const f = this.ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.setValueAtTime(filterFreq, now);
          src.connect(f);
          node = f;
        } catch (e) {}
      }
      node.connect(g);
      g.connect(this.ctx.destination);
      g.gain.setValueAtTime(Math.max(vol, 0.0001), now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.start(now);
      src.stop(now + dur + 0.01);
    },
    play: function (kind) {
      if (!this.enabled) return;
      this.ensure();
      if (!this.ctx) return;
      if (kind === 'hit') {
        // Punchy meaty thud: low body + mid knock + transient click/noise
        this._tone('sine', 95, 0.15, 0.085, 55);
        this._tone('triangle', 110, 0.12, 0.05, 60);
        this._tone('square', 220, 0.045, 0.028, 140);
        this._noise(0.04, 0.045, 1800);
        return;
      }
      if (kind === 'boom') {
        // Deeper secondary boom — punchy but under stacked hits
        this._tone('sawtooth', 70, 0.22, 0.055, 35);
        this._tone('sine', 55, 0.2, 0.04, 30);
        this._noise(0.1, 0.04, 900);
        return;
      }
      const now = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.connect(g);
      g.connect(this.ctx.destination);
      let freq = 440, dur = 0.08, type = 'square', vol = 0.04;
      if (kind === 'spawn') { freq = 520; dur = 0.06; type = 'triangle'; }
      else if (kind === 'win') { freq = 660; dur = 0.22; type = 'sine'; vol = 0.05; }
      else if (kind === 'lose') { freq = 140; dur = 0.28; type = 'sawtooth'; vol = 0.04; }
      else if (kind === 'upgrade') { freq = 600; dur = 0.1; type = 'sine'; vol = 0.045; }
      o.type = type;
      o.frequency.setValueAtTime(freq, now);
      if (kind === 'win') o.frequency.exponentialRampToValueAtTime(880, now + dur);
      if (kind === 'lose') o.frequency.exponentialRampToValueAtTime(50, now + dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.start(now);
      o.stop(now + dur + 0.02);
    },
    setMuted: function (muted) {
      this.enabled = !muted;
      try { localStorage.setItem('cw_sfx_mute', muted ? '1' : '0'); } catch (e) {}
    }
  };

  function loadStat(key) {
    try {
      const n = parseInt(localStorage.getItem(key) || '0', 10);
      return isNaN(n) || n < 0 ? 0 : n;
    } catch (e) { return 0; }
  }
  function saveStat(key, n) {
    try { localStorage.setItem(key, String(n)); } catch (e) {}
  }
  function loadJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function saveJson(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
  }

  function getTotalWins() { return loadStat(LS_WINS); }
  function getMetaGold() { return loadStat(LS_META_GOLD); }
  function setMetaGold(n) { saveStat(LS_META_GOLD, Math.max(0, n)); }

  function getUnitLvMap() {
    const m = loadJson(LS_UNIT_LV, {});
    ALL_UNIT_TYPES.forEach(function (t) {
      let v = parseInt(m[t] || 1, 10);
      if (isNaN(v) || v < 1) v = 1;
      if (v > 5) v = 5;
      m[t] = v;
    });
    return m;
  }
  function setUnitLvMap(m) { saveJson(LS_UNIT_LV, m); }

  function isUnlocked(type) {
    return getTotalWins() >= (UNLOCK_WINS[type] || 0);
  }
  function unlockedTypes() {
    return ALL_UNIT_TYPES.filter(isUnlocked);
  }

  function unlockNeedWins(type) {
    return Math.max(1, (UNLOCK_WINS[type] || 0) - getTotalWins());
  }
  function unlockToastMsg(type) {
    const def = UNIT_DEFS[type];
    const name = def ? def.name : type;
    return '再勝 ' + unlockNeedWins(type) + ' 場解鎖「' + name + '」';
  }
  function nextUnlockLine(wins) {
    if (wins == null) wins = getTotalWins();
    for (let i = 0; i < ALL_UNIT_TYPES.length; i++) {
      const t = ALL_UNIT_TYPES[i];
      const need = UNLOCK_WINS[t] || 0;
      if (need > wins) {
        const def = UNIT_DEFS[t];
        return '下一解鎖：' + (def ? def.name : t) + '（再勝 ' + (need - wins) + '）';
      }
    }
    return '下一解鎖：已全部解鎖';
  }

  function normalizeLoadout(arr) {
    const seen = {};
    const out = [];
    (arr || []).forEach(function (t) {
      if (!UNIT_DEFS[t] || !isUnlocked(t) || seen[t]) return;
      seen[t] = 1;
      out.push(t);
    });
    const pool = unlockedTypes();
    for (let i = 0; i < pool.length && out.length < 4; i++) {
      if (!seen[pool[i]]) { seen[pool[i]] = 1; out.push(pool[i]); }
    }
    if (out.length === 0) out.push('sword', 'archer');
    return out.slice(0, 4);
  }

  function getLoadout() {
    return normalizeLoadout(loadJson(LS_LOADOUT, DEFAULT_LOADOUT));
  }
  function setLoadout(arr) {
    saveJson(LS_LOADOUT, normalizeLoadout(arr));
  }

  function unitStats(type, permanentLv, trainBonus) {
    const def = UNIT_DEFS[type];
    const lv = Math.max(1, Math.min(5, (permanentLv || 1) + (trainBonus || 0)));
    const steps = lv - 1;
    let hp = def.hp;
    let dmg = def.dmg;
    for (let i = 0; i < steps; i++) {
      hp = Math.round(hp * 1.12);
      dmg = Math.round(dmg * 1.10);
    }
    return { hp: hp, dmg: dmg, lv: lv };
  }

  function enemyScale() {
    const wins = getTotalWins();
    const steps = Math.floor(wins / 3);
    return Math.min(1.4, Math.pow(1.06, steps));
  }

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  let eCastleLv = 1;

  function formatTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function syncRecordHud() {
    const streak = loadStat(LS_STREAK);
    const wins = loadStat(LS_WINS);
    const streakEl = document.getElementById('streakHud');
    const winsEl = document.getElementById('winsHud');
    if (streakEl) streakEl.textContent = String(streak);
    if (winsEl) winsEl.textContent = String(wins);
    const wrap = document.getElementById('streakBadgeWrap');
    const num = document.getElementById('streakBadgeNum');
    if (num) num.textContent = String(streak);
    if (wrap) {
      if (streak > 0) wrap.classList.add('show');
      else wrap.classList.remove('show');
    }
    if (metaGoldHud) metaGoldHud.textContent = '★' + getMetaGold();
    if (castleLvHud) {
      let flag = castleLvHud.querySelector('.castle-lv-flag');
      castleLvHud.textContent = '';
      if (flag) castleLvHud.appendChild(flag);
      else if (ART_UI.castleLvFlag) {
        flag = document.createElement('img');
        flag.className = 'castle-lv-flag';
        flag.alt = '';
        flag.src = ART_UI.castleLvFlag;
        castleLvHud.appendChild(flag);
      }
      castleLvHud.appendChild(document.createTextNode(pCastleLv >= 5 ? '城 Lv.5/5 MAX' : ('城 Lv.' + pCastleLv + '/5')));
    }
  }

  function resize() {
    const wrap = document.getElementById('stageWrap');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H * 0.72;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 100); });
  resize();

  function castleX(side) {
    return side === 'p' ? W * 0.08 : W * 0.92;
  }

  function goldRate() {
    return GOLD_PER_SEC * (goldBoosted ? GOLD_BOOST_MULT : 1);
  }

  function castleDmg(side) {
    const lv = side === 'p' ? pCastleLv : eCastleLv;
    let d = 8 + (lv - 1) * 3;
    if (side === 'e') d = Math.floor(d * 0.85);
    return d;
  }
  function castleInterval(side) {
    const lv = side === 'p' ? pCastleLv : eCastleLv;
    return Math.max(0.6, 1.2 - (lv - 1) * 0.12);
  }
  function castleRange() {
    return W * 0.55;
  }

  function rebuildUnitButtons() {
    const host = document.getElementById('unitSlots');
    if (!host) return;
    host.innerHTML = '';
    const lvMap = getUnitLvMap();
    activeLoadout.forEach(function (type) {
      const def = UNIT_DEFS[type];
      if (!def) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'unit';
      btn.dataset.unit = type;
      btn.id = 'btnUnit_' + type;
      const locked = !isUnlocked(type);
      if (locked) btn.classList.add('locked');
      const icon = document.createElement('span');
      icon.className = 'unit-icon';
      icon.setAttribute('aria-hidden', 'true');
      if (def.iconUrl) {
        const img = document.createElement('img');
        img.src = def.iconUrl;
        img.alt = def.name;
        img.width = 36; img.height = 36;
        img.onerror = function () { icon.textContent = def.iconEmoji || ''; };
        icon.appendChild(img);
      } else {
        icon.textContent = def.iconEmoji || '';
      }
      if (locked && ART_UI.lock64) {
        const lock = document.createElement('img');
        lock.className = 'unit-lock-overlay';
        lock.src = ART_UI.lock64;
        lock.alt = '';
        icon.appendChild(lock);
      }
      const name = document.createElement('span');
      name.className = 'unit-name';
      name.textContent = def.name;
      const cost = document.createElement('span');
      cost.className = 'cost';
      cost.textContent = def.cost + ' 金幣';
      const badge = document.createElement('span');
      badge.className = 'unit-lv-badge';
      const train = trainBonus[type] || 0;
      badge.textContent = 'Lv.' + ((lvMap[type] || 1) + train);
      btn.appendChild(icon);
      btn.appendChild(name);
      btn.appendChild(cost);
      btn.appendChild(badge);
      btn.addEventListener('click', function () {
        if (!isUnlocked(type)) {
          showToast(unlockToastMsg(type));
          return;
        }
        trySpawn(type);
      });
      // color accents
      const colors = {
        sword: '#3d7ea6', archer: '#6a8f3d', giant: '#a65c3d', bomber: '#7b4aa6',
        spear: '#00897b', ninja: '#546e7a', mage: '#7e57c2'
      };
      btn.style.background = colors[type] || '#4a3f5c';
      host.appendChild(btn);
    });
  }

  function updateHud() {
    goldEl.textContent = Math.floor(gold);
    pHpFill.style.transform = 'scaleX(' + Math.max(0, pCastle / pCastleMax) + ')';
    eHpFill.style.transform = 'scaleX(' + Math.max(0, eCastle / eCastleMax) + ')';
    if (castleLvHud) {
      let flag = castleLvHud.querySelector('.castle-lv-flag');
      castleLvHud.textContent = '';
      if (flag) castleLvHud.appendChild(flag);
      else if (ART_UI.castleLvFlag) {
        flag = document.createElement('img');
        flag.className = 'castle-lv-flag';
        flag.alt = '';
        flag.src = ART_UI.castleLvFlag;
        castleLvHud.appendChild(flag);
      }
      castleLvHud.appendChild(document.createTextNode(pCastleLv >= 5 ? '城 Lv.5/5 MAX' : ('城 Lv.' + pCastleLv + '/5')));
    }
    if (metaGoldHud) metaGoldHud.textContent = '★' + getMetaGold();
    if (goldBoosted) {
      btnGoldBoost.textContent = '產金 +30%';
      btnGoldBoost.disabled = true;
    } else {
      btnGoldBoost.textContent = '加速產金 · 200';
      btnGoldBoost.disabled = !running || gold < GOLD_BOOST_COST;
    }
    if (btnCastleAtk) {
      btnCastleAtk.textContent = castleAtkOn ? '城攻開' : '城攻關';
      btnCastleAtk.classList.toggle('off', !castleAtkOn);
    }
    if (btnCastleUp) {
      if (pCastleLv >= 5) {
        btnCastleUp.innerHTML = '城滿級<br/>Lv.5/5 MAX';
        btnCastleUp.disabled = true;
      } else {
        const cost = CASTLE_UP_COSTS[pCastleLv];
        btnCastleUp.innerHTML = '城 LV↑<br/>' + cost;
        btnCastleUp.disabled = !running || gold < cost;
      }
    }
  }

  function updateButtons() {
    const cooling = spawnCd > 0;
    const lvMap = getUnitLvMap();
    activeLoadout.forEach(function (type) {
      const btn = document.getElementById('btnUnit_' + type);
      if (!btn) return;
      const def = UNIT_DEFS[type];
      const locked = !isUnlocked(type);
      btn.disabled = locked || !running || gold < def.cost || cooling;
      const badge = btn.querySelector('.unit-lv-badge');
      if (badge) badge.textContent = 'Lv.' + ((lvMap[type] || 1) + (trainBonus[type] || 0));
    });
    if (!goldBoosted) {
      btnGoldBoost.disabled = !running || gold < GOLD_BOOST_COST;
    }
    if (!running) {
      cdHint.textContent = matchStarted ? '對局已結束' : '請先編隊開戰';
    } else if (cooling) {
      cdHint.textContent = '出兵冷卻中…';
    } else {
      cdHint.textContent = goldBoosted ? '產金加速中' : '';
    }
    updateHud();
  }

  function resetMatchState() {
    gold = GOLD_START;
    pCastleLv = 1;
    eCastleLv = 1;
    pCastleMax = CASTLE_MAX_BASE;
    eCastleMax = CASTLE_MAX_BASE;
    pCastle = pCastleMax;
    eCastle = eCastleMax;
    units = [];
    projectiles = [];
    castleArrows = [];
    fx = [];
    spawnCd = 0;
    enemyTimer = getTotalWins() < 2 ? 5.5 : 2.5; // v1.4.8: +3s first wave when wins<2
    goldAcc = 0;
    gameTime = 0;
    goldBoosted = false;
    killCount = 0;
    endHandled = false;
    pCastleAtkCd = 0;
    eCastleAtkCd = 0;
    trainBonus = {};
    overlay.classList.remove('show', 'win', 'lose');
    endTitle.textContent = '';
    endSub.textContent = '';
  }

  function openPreBattle() {
    running = false;
    matchStarted = false;
    resetMatchState();
    activeLoadout = getLoadout();
    draftLoadout = activeLoadout.slice();
    rebuildUnitButtons();
    renderPreBattle();
    if (preBattle) preBattle.classList.add('show');
    updateButtons();
    syncRecordHud();
  }

  function startMatch() {
    if (draftLoadout.length < 1) {
      showToast('至少揀 1 個兵種');
      return;
    }
    setLoadout(draftLoadout);
    activeLoadout = getLoadout();
    resetMatchState();
    matchStarted = true;
    running = true;
    if (preBattle) preBattle.classList.remove('show');
    rebuildUnitButtons();
    updateButtons();
    syncRecordHud();
    SFX.play('spawn');
  }

  function renderPreBattle() {
    const slots = document.getElementById('loadoutSlots');
    const pool = document.getElementById('unitPool');
    const rows = document.getElementById('barracksRows');
    const brMeta = document.getElementById('brMetaGold');
    if (brMeta) brMeta.textContent = String(getMetaGold());
    if (slots) {
      slots.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const slot = document.createElement('div');
        slot.className = 'loadout-slot' + (draftLoadout[i] ? ' filled' : '');
        const t = draftLoadout[i];
        if (t && UNIT_DEFS[t]) {
          const def = UNIT_DEFS[t];
          if (def.iconUrl) {
            const im = document.createElement('img');
            im.className = 'slot-icon';
            im.src = def.iconUrl;
            im.alt = def.name;
            slot.appendChild(im);
          }
          const lab = document.createElement('span');
          lab.textContent = def.name;
          slot.appendChild(lab);
          slot.addEventListener('click', function () {
            draftLoadout.splice(i, 1);
            renderPreBattle();

          slot.textContent = '空位 ' + (i + 1);

          const cost = UNIT_UP_COSTS[lv];
          btn.textContent = '升 LV · ★' + cost;
          btn.disabled = meta < cost;
          btn.addEventListener('click', function () {
            let m = getMetaGold();
            const map = getUnitLvMap();
            const cur = map[t] || 1;
            if (cur >= 5) return;
            const c = UNIT_UP_COSTS[cur];
            if (m < c) { showToast('★ 不足'); return; }
            setMetaGold(m - c);
            map[t] = cur + 1;
            setUnitLvMap(map);
            SFX.play('upgrade');
            renderPreBattle();
            syncRecordHud();
          });
        }
        row.appendChild(left);
        row.appendChild(btn);
        rows.appendChild(row);
      });
    }
  }

  // Fix castle upgrade properly
  function tryUpgradeCastle() {
    if (!running || pCastleLv >= 5) return;
    const cost = CASTLE_UP_COSTS[pCastleLv];
    if (gold < cost) return;
    gold -= cost;
    const missingBefore = pCastleMax - pCastle;
    pCastleLv += 1;
    pCastleMax = CASTLE_MAX_BASE + (pCastleLv - 1) * 80;
    pCastle = Math.min(pCastleMax, pCastle + Math.floor(missingBefore * 0.4));
    // Also the new max means current HP stays; missingBefore was vs old max — design says heal +40% of missing HP
    SFX.play('upgrade');
    showToast('城堡升至 Lv.' + pCastleLv);
    updateHud();
    updateButtons();
  }

  function grantBounty(victimType, killerSide) {
    const b = KILL_BOUNTY[victimType] || 0;
    if (b <= 0) return;
    if (killerSide === 'p') {
      gold += b;
      updateHud();
    }
  }


  function atkDur(kind) {
    if (kind === 'boom') return ATK_BOOM_DUR;
    if (kind === 'ranged') return ATK_RANGED_DUR;
    return ATK_MELEE_DUR;
  }

  function startAtkAnim(u, kind) {
    u.atkPlaying = true;
    u.atkT = 0;
    u.atkKind = kind;
  }

  /** Draw offsets in facing-local space (+X = forward after scale(dir,1)). */
  function getAtkDraw(u) {
    if (!u.atkPlaying) return { ox: 0, oy: 0, sx: 1, sy: 1, rot: 0 };
    const t = u.atkT;
    const kind = u.atkKind;
    if (kind === 'boom') {
      const mid = ATK_BOOM_DUR * 0.5;
      let s;
      if (t < mid) s = 1 + 0.15 * (t / Math.max(1e-6, mid));
      else s = 1.15 - 0.15 * ((t - mid) / Math.max(1e-6, mid));
      return { ox: 0, oy: 0, sx: s, sy: s, rot: 0 };
    }
    if (kind === 'ranged') {
      const p = Math.min(1, t / ATK_RANGED_DUR);
      const wave = Math.sin(p * Math.PI);
      return { ox: wave * 10, oy: 0, sx: 1, sy: 1, rot: wave * (12 * Math.PI / 180) };
    }
    // melee: windup → strike → recover (~250ms)
    const wEnd = 0.07, sEnd = 0.16, rEnd = ATK_MELEE_DUR;
    if (t < wEnd) {
      const p = t / wEnd;
      return { ox: -6 * p, oy: 0, sx: 1, sy: 1, rot: 0 };
    }
    if (t < sEnd) {
      const p = (t - wEnd) / (sEnd - wEnd);
      return { ox: -6 + 19 * p, oy: 0, sx: 1 + 0.1 * p, sy: 1, rot: 0 };
    }
    {
      const p = Math.min(1, (t - sEnd) / Math.max(1e-6, rEnd - sEnd));
      return { ox: 13 * (1 - p), oy: 0, sx: 1.1 - 0.1 * p, sy: 1, rot: 0 };
    }
  }

  function applyHitFeedback(target, fromX) {
    target.flash = FLASH_TIME;
    const dir = target.x >= fromX ? 1 : -1;
    target.x += dir * KNOCKBACK;
  }

  function killUnit(u, killerSide) {
    if (!u.alive) return;
    u.alive = false;
    if (killerSide === 'p') killCount += 1;
    grantBounty(u.type, killerSide);
  }

  function damageUnit(u, dmg, fromX, attackerSide) {
    if (!u.alive) return;
    u.hp -= dmg;
    applyHitFeedback(u, fromX);
    SFX.play('hit');
    if (u.hp <= 0) killUnit(u, attackerSide);
  }

  function explodeBomber(u) {
    const def = UNIT_DEFS.bomber;
    const r = def.explodeRadius;
    const dmg = def.explodeDmg;
    fx.push({ x: u.x, y: u.y - def.height * 0.4, life: 0.35, r: r });
    SFX.play('boom');
    for (let i = 0; i < units.length; i++) {
      const o = units[i];
      if (!o.alive || o === u || o.side === u.side) continue;
      if (Math.abs(o.x - u.x) <= r) {
        o.hp -= dmg;
        applyHitFeedback(o, u.x);
        if (o.hp <= 0) {
          o.alive = false;
          if (u.side === 'p') killCount += 1;
          grantBounty(o.type, u.side);
        } else {
          SFX.play('hit');
        }
      }
    }
    const enemyCastleX = castleX(u.side === 'p' ? 'e' : 'p');
    if (Math.abs(u.x - enemyCastleX) < r + 20) {
      if (u.side === 'p') eCastle = Math.max(0, eCastle - Math.floor(dmg * 0.45));
      else pCastle = Math.max(0, pCastle - Math.floor(dmg * 0.45));
      updateHud();
    }
    u.alive = false;
  }

  function countNearSpawn(side, x, radius) {
    let n = 0;
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (!u.alive || u.side !== side) continue;
      if (Math.abs(u.x - x) < radius) n++;
    }
    return n;
  }

  function spawn(type, side) {
    const def = UNIT_DEFS[type];
    if (!def) return;
    const dir = side === 'p' ? 1 : -1;
    let x = castleX(side) + dir * 36;
    const crowd = countNearSpawn(side, x, def.radius * 2.5);
    if (crowd > 0) x += dir * (12 + crowd * 10);
    const lvMap = getUnitLvMap();
    const train = side === 'p' ? (trainBonus[type] || 0) : 0;
    let st = unitStats(type, side === 'p' ? (lvMap[type] || 1) : 1, train);
    if (side === 'e') {
      const sc = enemyScale();
      st = { hp: Math.round(st.hp * sc), dmg: Math.round(st.dmg * sc), lv: st.lv };
    }
    units.push({
      type: type,
      side: side,
      x: x,
      y: groundY,
      hp: st.hp,
      maxHp: st.hp,
      dmg: st.dmg,
      cd: 0,
      atkCd: 0,
      alive: true,
      flash: 0,
      atkPlaying: false,
      atkT: 0,
      atkKind: null,
      skin: def.skin,
      spriteKey: def.spriteKey
    });
  }

  function trySpawn(type) {
    const def = UNIT_DEFS[type];
    if (!def || !running || gold < def.cost || spawnCd > 0) return;
    if (!isUnlocked(type)) return;
    if (activeLoadout.indexOf(type) < 0) return;
    gold -= def.cost;
    spawnCd = PLAYER_SPAWN_CD;
    spawn(type, 'p');
    SFX.play('spawn');
    updateHud();
    updateButtons();
  }

  function tryBuyGoldBoost() {
    if (!running || goldBoosted || gold < GOLD_BOOST_COST) return;
    gold -= GOLD_BOOST_COST;
    goldBoosted = true;
    SFX.play('spawn');
    updateHud();
    updateButtons();
  }

  function tryTrain(type) {
    if (!running || !isUnlocked(type)) return;
    const cur = trainBonus[type] || 0;
    if (cur >= 2) { showToast('本局訓練已滿'); return; }
    const cost = TRAIN_COSTS[cur];
    if (gold < cost) { showToast('金幣不足'); return; }
    gold -= cost;
    trainBonus[type] = cur + 1;
    SFX.play('upgrade');
    showToast(UNIT_DEFS[type].name + ' 本局 +1（訓練）');
    updateButtons();
  }

  document.getElementById('btnRestart').addEventListener('click', openPreBattle);
  document.getElementById('btnAgain').addEventListener('click', openPreBattle);
  btnGoldBoost.addEventListener('click', tryBuyGoldBoost);
  if (btnCastleAtk) {
    btnCastleAtk.addEventListener('click', function () {
      castleAtkOn = !castleAtkOn;
      updateHud();
    });
  }
  if (btnCastleUp) {
    btnCastleUp.addEventListener('click', tryUpgradeCastle);
  }
  const btnStart = document.getElementById('btnStartMatch');
  if (btnStart) btnStart.addEventListener('click', startMatch);

  // Double-tap unit button corner: long-press train via holding — simpler: add train on second HUD
  // Use cdHint area: when holding shift not available on mobile — add click on badge via contextmenu
  document.getElementById('controls').addEventListener('contextmenu', function (e) {
    const btn = e.target.closest('button.unit');
    if (!btn || !btn.dataset.unit) return;
    e.preventDefault();
    tryTrain(btn.dataset.unit);
  });
  // Also: double-click to train
  document.getElementById('controls').addEventListener('dblclick', function (e) {

  function aiPhase() {
    if (gameTime < 45) return 'early';
    if (gameTime < 100) return 'mid';
    return 'late';
  }

  function syncEnemyCastleLv() {
    const phase = aiPhase();
    let want = 1;
    if (phase === 'mid') want = 2;
    else if (phase === 'late') want = 3;
    if (want > eCastleLv) {
      while (eCastleLv < want) {
        eCastleLv += 1;
        eCastleMax = CASTLE_MAX_BASE + (eCastleLv - 1) * 80;
        eCastle = Math.min(eCastleMax, eCastle + 80);
      }
    }
  }

  function enemyAi(dt) {
    enemyTimer -= dt;
    if (enemyTimer > 0) return;
    const phase = aiPhase();
    const wins = getTotalWins();
    let minI, maxI;
    if (phase === 'early') {
      minI = 2.4; maxI = 4.2;
      // v1.4.8: slow early pressure for first two matches
      if (wins === 0) { minI *= 1.25; maxI *= 1.25; }
      else if (wins === 1) { minI *= 1.11; maxI *= 1.11; }
    }
    else if (phase === 'mid') { minI = 1.7; maxI = 3.2; }
    else { minI = 1.4; maxI = 2.65; }
    enemyTimer = minI + Math.random() * (maxI - minI);

    const pool = unlockedTypes();
    // Prefer stronger units when many wins
    let weights = pool.map(function (t) {
      let w = 1;
      if (t === 'sword') w = 3;
      if (t === 'archer') w = 2.5;
      if (t === 'giant') w = phase === 'early' ? 0.8 : 2;
      if (t === 'bomber') w = phase === 'early' ? 0.3 : 1.5;
      if (t === 'spear') w = 1.6;
      if (t === 'ninja') w = wins >= 7 ? 1.8 : 0.5;
      if (t === 'mage') w = wins >= 12 ? 1.4 : 0.3;
      if (phase === 'late' && (t === 'giant' || t === 'mage' || t === 'ninja')) w *= 1.2;
      return w;
    });
    if (eCastle < eCastleMax * 0.4) {
      pool.forEach(function (t, i) {
        if (t === 'giant' || t === 'bomber' || t === 'mage') weights[i] *= 1.5;
      });
    }
    let sum = weights.reduce(function (a, b) { return a + b; }, 0);
    let r = Math.random() * sum;
    let type = pool[0] || 'sword';
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) { type = pool[i]; break; }
    }
    const pCount = units.filter(function (u) { return u.side === 'p' && u.alive; }).length;
    if (pCount >= 4) enemyTimer *= 0.85;
    spawn(type, 'e');
  }

  function findTarget(u) {
    let best = null;
    let bestDist = Infinity;
    const dir = u.side === 'p' ? 1 : -1;
    for (let i = 0; i < units.length; i++) {
      const o = units[i];
      if (!o.alive || o.side === u.side) continue;
      const dx = (o.x - u.x) * dir;
      if (dx < -10) continue;
      const dist = Math.abs(o.x - u.x);
      if (dist < bestDist) {
        bestDist = dist;
        best = o;
      }
    }
    return { target: best, dist: bestDist };
  }

  function findCastleTarget(side) {
    // nearest enemy unit in range toward enemy, or castle
    const from = castleX(side);
    const dir = side === 'p' ? 1 : -1;
    const range = castleRange();
    let best = null;
    let bestDist = Infinity;
    for (let i = 0; i < units.length; i++) {
      const o = units[i];
      if (!o.alive || o.side === side) continue;
      const dx = (o.x - from) * dir;
      if (dx < 0 || dx > range) continue;
      if (dx < bestDist) {
        bestDist = dx;
        best = o;
      }
    }
    return { target: best, dist: bestDist, aimCastle: !best };
  }

  function fireCastle(side) {
    if (!castleAtkOn && side === 'p') return;
    const info = findCastleTarget(side);
    const from = castleX(side);
    const dir = side === 'p' ? 1 : -1;
    const dmg = castleDmg(side);
    let aimX;
    if (info.target) aimX = info.target.x;
    else aimX = castleX(side === 'p' ? 'e' : 'p');
    // Only fire if something in range (unit or enemy castle within range)
    const dx = (aimX - from) * dir;
    if (dx < 0 || dx > castleRange()) return;
    const y = groundY - Math.min(96, Math.max(70, H * 0.22)) * 0.72;
    castleArrows.push({
      x: from + dir * 10,
      y: y,
      vx: dir * 260,
      dmg: dmg,
      side: side,
      life: 1.4,
      kind: 'castle'
    });
  }

  function updateCastleAtk(dt) {
    syncEnemyCastleLv();
    pCastleAtkCd -= dt;
    eCastleAtkCd -= dt;
    if (pCastleAtkCd <= 0) {
      fireCastle('p');
      pCastleAtkCd = castleInterval('p');
    }
    if (eCastleAtkCd <= 0) {
      fireCastle('e');
      eCastleAtkCd = castleInterval('e');
    }
  }

  function separateAllies() {
    for (let i = 0; i < units.length; i++) {
      const a = units[i];
      if (!a.alive) continue;
      const ra = UNIT_DEFS[a.type].radius;
      for (let j = i + 1; j < units.length; j++) {
        const b = units[j];
        if (!b.alive || b.side !== a.side) continue;
        const rb = UNIT_DEFS[b.type].radius;
        const minDist = (ra + rb) * SEPARATION_FACTOR;
        const dx = b.x - a.x;
        const dist = Math.abs(dx);
        if (dist >= minDist || dist < 0.001) {
          if (dist < 0.001) {
            const push = (minDist * 0.5);
            const dir = a.side === 'p' ? 1 : -1;
            a.x -= dir * push * 0.5;
            b.x += dir * push * 0.5;
          }
          continue;
        }
        const overlap = minDist - dist;
        const push = overlap * 0.5;
        if (dx > 0) { a.x -= push; b.x += push; }
        else { a.x += push; b.x -= push; }
      }
    }
  }

  function atkCooldown(type) {
    if (type === 'archer' || type === 'mage') return 0.85;
    if (type === 'giant') return 1.1;
    if (type === 'ninja') return 0.55;
    if (type === 'spear') return 0.75;
    return 0.7;
  }

  function updateUnits(dt) {
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (!u.alive) continue;
      const def = UNIT_DEFS[u.type];
      const dir = u.side === 'p' ? 1 : -1;
      const dmg = u.dmg != null ? u.dmg : def.dmg;
      u.atkCd = Math.max(0, u.atkCd - dt);
      if (u.flash > 0) u.flash = Math.max(0, u.flash - dt);

      // Advance procedural ATK anim (per-unit; cheap)
      if (u.atkPlaying) {
        u.atkT += dt;
        if (u.atkKind === 'boom' && u.atkT >= ATK_BOOM_DUR) {
          u.atkPlaying = false;
          u.atkT = 0;
          explodeBomber(u);
          continue;
        }
        if (u.atkKind !== 'boom' && u.atkT >= atkDur(u.atkKind)) {
          u.atkPlaying = false;
          u.atkT = 0;
          u.atkKind = null;
        }
      }

      const info = findTarget(u);
      const inRange = info.target && info.dist <= def.range;

      if (inRange) {
        if (u.type === 'bomber') {
          if (!(u.atkPlaying && u.atkKind === 'boom')) {
            startAtkAnim(u, 'boom');
          }
        } else if (u.atkCd <= 0) {
          u.atkCd = atkCooldown(u.type);
          if (u.type === 'archer' || u.type === 'mage') {
            startAtkAnim(u, 'ranged');
            projectiles.push({
              x: u.x + dir * 8,
              y: u.y - def.height * 0.55,
              vx: dir * (u.type === 'mage' ? 200 : 220),
              dmg: dmg,
              side: u.side,
              life: 1.2,
              kind: u.type === 'mage' ? 'mage' : 'arrow'
            });
          } else {
            startAtkAnim(u, 'melee');
            damageUnit(info.target, dmg, u.x, u.side);
          }
        }
      } else if (!(u.atkPlaying && u.atkKind === 'boom')) {
        u.x += dir * def.speed * dt;
      }

      if (!u.alive) continue;

      const enemyCastleX = castleX(u.side === 'p' ? 'e' : 'p');
      if (Math.abs(u.x - enemyCastleX) < 40) {
        if (u.type === 'bomber') {
          if (!(u.atkPlaying && u.atkKind === 'boom')) {
            startAtkAnim(u, 'boom');
          }
          u.x = enemyCastleX - dir * 38;
          continue;
        }
        if (u.atkCd <= 0) {
          u.atkCd = 0.8;
          if (u.type === 'archer' || u.type === 'mage') startAtkAnim(u, 'ranged');
          else startAtkAnim(u, 'melee');
          if (u.side === 'p') eCastle = Math.max(0, eCastle - dmg);
          else pCastle = Math.max(0, pCastle - dmg);
          SFX.play('hit');
          updateHud();
        }
        u.x = enemyCastleX - dir * 38;
      }
    }
    separateAllies();
    units = units.filter(function (u) { return u.alive; });
  }

  function updateProjectiles(dt) {
    const all = projectiles.concat(castleArrows);
    // update both arrays separately
    function step(list) {
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        p.x += p.vx * dt;
        p.life -= dt;
        let hit = false;
        for (let j = 0; j < units.length; j++) {
          const u = units[j];
          if (!u.alive || u.side === p.side) continue;
          if (Math.abs(u.x - p.x) < UNIT_DEFS[u.type].radius + 4) {
            damageUnit(u, p.dmg, p.x, p.side);
            hit = true;
            break;
          }
        }
        if (!hit) {
          const cx = castleX(p.side === 'p' ? 'e' : 'p');
          if (Math.abs(p.x - cx) < 30) {
            if (p.side === 'p') eCastle = Math.max(0, eCastle - p.dmg);
            else pCastle = Math.max(0, pCastle - p.dmg);
            updateHud();
            hit = true;
          }
        }
        if (hit || p.life <= 0) p.life = -1;
      }
      return list.filter(function (p) { return p.life > 0; });
    }
    projectiles = step(projectiles);
    castleArrows = step(castleArrows);
    units = units.filter(function (u) { return u.alive; });
  }

  function updateFx(dt) {
    for (let i = 0; i < fx.length; i++) fx[i].life -= dt;
    fx = fx.filter(function (f) { return f.life > 0; });
  }

  function showEndCard(won) {

    const enu = document.getElementById('endNextUnlock');
    if (enu) enu.textContent = nextUnlockLine(wins);

    updateButtons();
  }

  function checkEnd() {
    if (eCastle <= 0) { showEndCard(true); return; }
    if (pCastle <= 0) { showEndCard(false); }
  }

  function getUnitDrawStyle(u) {
    const def = UNIT_DEFS[u.type];
    return {
      color: u.side === 'p' ? def.color : '#ef9a9a',
      height: def.height,
      radius: def.radius,
      skin: u.skin != null ? u.skin : def.skin,
      spriteKey: u.spriteKey || def.spriteKey || u.type
    };
  }

  function drawStick(u) {
    const def = UNIT_DEFS[u.type];
    const style = getUnitDrawStyle(u);
    const x = u.x;
    const y = u.y;
    const h = style.height;
    const dir = u.side === 'p' ? 1 : -1;
    let col = style.color;
    if (u.flash > 0) col = '#ffffff';

    let img = UNIT_IMGS[u.type];
    if (u.atkPlaying) {
      const atkImg = UNIT_ATK_IMGS[u.type];
      if (atkImg && atkImg.complete && atkImg.naturalWidth > 0) img = atkImg;
    }
    const ad = getAtkDraw(u);
    if (img && img.complete && img.naturalWidth > 0) {
      const drawH = Math.max(h * 1.45, 40);
      const drawW = drawH;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);
      ctx.translate(ad.ox, ad.oy);
      if (ad.rot) ctx.rotate(ad.rot);
      ctx.scale(ad.sx, ad.sy);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, 2, style.radius * 0.9, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      if (u.flash > 0) ctx.globalAlpha = 0.75;
      ctx.drawImage(img, -drawW / 2, -drawH + 2, drawW, drawH);
      ctx.restore();

      const bw = style.radius * 2.2;
      const ratio = Math.max(0, u.hp / u.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(x - bw / 2, y - drawH - 8, bw, 4);
      ctx.fillStyle = ratio > 0.4 ? '#66bb6a' : '#ef5350';
      ctx.fillRect(x - bw / 2, y - drawH - 8, bw * ratio, 4);
      return;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir, 1);
    ctx.translate(ad.ox, ad.oy);
    if (ad.rot) ctx.rotate(ad.rot);
    ctx.scale(ad.sx, ad.sy);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 2, style.radius * 0.9, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = col;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // legs
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.35);
    ctx.lineTo(-6, 0);
    ctx.moveTo(0, -h * 0.35);
    ctx.lineTo(6, 0);
    ctx.stroke();
    // torso
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.35);
    ctx.lineTo(0, -h * 0.7);
    ctx.stroke();
    // arms
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(10, -h * 0.45);
    ctx.moveTo(0, -h * 0.55);
    ctx.lineTo(-8, -h * 0.5);
    ctx.stroke();

    if (u.type === 'sword') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#eee';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(10, -h * 0.45);
      ctx.lineTo(18, -h * 0.75);
      ctx.stroke();
    } else if (u.type === 'archer') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#8d6e63';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(12, -h * 0.5, 8, -0.8, 0.8);
      ctx.stroke();
    } else if (u.type === 'bomber') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#5d4037';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(12, -h * 0.55, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.moveTo(12, -h * 0.55 - 6);
      ctx.lineTo(16, -h * 0.55 - 12);
      ctx.stroke();
    } else if (u.type === 'spear') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#b0bec5';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(8, -h * 0.4);
      ctx.lineTo(22, -h * 0.85);
      ctx.stroke();
    } else if (u.type === 'ninja') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#90a4ae';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(10, -h * 0.48);
      ctx.lineTo(16, -h * 0.7);
      ctx.moveTo(10, -h * 0.48);
      ctx.lineTo(17, -h * 0.55);
      ctx.stroke();
    } else if (u.type === 'mage') {
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#7e57c2';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(10, -h * 0.35);
      ctx.lineTo(10, -h * 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(10, -h * 0.88, 3, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      // giant club — thin stick
      ctx.strokeStyle = u.flash > 0 ? '#fff' : '#6d4c41';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(8, -h * 0.45);
      ctx.lineTo(14, -h * 0.75);
      ctx.stroke();
    }

    // head outline only (stickman)
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, -h * 0.82, u.type === 'giant' ? 8 : 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = u.flash > 0 ? '#fff' : '#222';
    ctx.beginPath();
    ctx.arc(2, -h * 0.84, 1.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    const bw = style.radius * 2.2;
    const ratio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x - bw / 2, y - h - 10, bw, 4);
    ctx.fillStyle = ratio > 0.4 ? '#66bb6a' : '#ef5350';
    ctx.fillRect(x - bw / 2, y - h - 10, bw * ratio, 4);
  }

  function drawCastle(side) {
    const x = castleX(side);
    const base = groundY;
    const hp = side === 'p' ? pCastle : eCastle;
    const maxHp = side === 'p' ? pCastleMax : eCastleMax;
    const skin = side === 'p' ? CASTLE_SKIN.player : CASTLE_SKIN.enemy;
    const img = side === 'p' ? castleImgP : castleImgE;
    const drawH = Math.min(96, Math.max(70, H * 0.22));
    const drawW = drawH;
    const lv = side === 'p' ? pCastleLv : eCastleLv;

    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x - drawW / 2, base - drawH, drawW, drawH);
    } else {
      const col = skin.color;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      const w = 44, h = 64;
      ctx.strokeRect(x - w / 2, base - h, w, h);
      for (let i = 0; i < 3; i++) {
        ctx.strokeRect(x - w / 2 + i * 16, base - h - 10, 10, 10);
      }
      ctx.beginPath();
      ctx.moveTo(x, base - h - 10);
      ctx.lineTo(x, base - h - 32);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, base - h - 32);
      ctx.lineTo(x + (side === 'p' ? 14 : -14), base - h - 24);
      ctx.lineTo(x, base - h - 16);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 3;
    const label = Math.ceil(hp) + ' · Lv.' + lv;
    ctx.strokeText(label, x, base - drawH - 8);
    ctx.fillText(label, x, base - drawH - 8);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#b8e4f8'; /* v1.4.9 CW3 sky */
    ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    [[W * 0.2, 40], [W * 0.55, 28], [W * 0.8, 50]].forEach(function (c) {
      ctx.beginPath();
      ctx.arc(c[0], c[1], 18, 0, Math.PI * 2);
      ctx.arc(c[0] + 16, c[1] + 2, 14, 0, Math.PI * 2);
      ctx.arc(c[0] - 14, c[1] + 4, 12, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = '#6bbf5a';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#5aad4a';
    ctx.fillRect(0, groundY, W, 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(castleX('p') + 40, groundY - 2);
    ctx.lineTo(castleX('e') - 40, groundY - 2);
    ctx.stroke();
    ctx.setLineDash([]);

    drawCastle('p');
    drawCastle('e');
    units.slice().sort(function (a, b) { return a.x - b.x; }).forEach(drawStick);

    function drawArrow(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.vx > 0 ? 0 : Math.PI);
      if (p.kind === 'mage') {
        ctx.strokeStyle = '#b39ddb';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.kind === 'castle') {
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(8, 0);
        ctx.moveTo(4, -3);
        ctx.lineTo(8, 0);
        ctx.lineTo(4, 3);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#5d4037';
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-4, -3);
        ctx.lineTo(-4, 3);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
    projectiles.forEach(drawArrow);
    castleArrows.forEach(drawArrow);

    fx.forEach(function (f) {
      const t = Math.max(0, f.life / 0.35);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,180,40,' + (0.55 * t) + ')';
      ctx.arc(f.x, f.y, f.r * (1.1 - t * 0.3), 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.font = 'bold 13px "PingFang TC","Noto Sans TC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('城堡', castleX('p'), groundY + 22);
    ctx.fillText('城堡', castleX('e'), groundY + 22);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;

    if (running) {
      gameTime += dt;
      goldAcc += goldRate() * dt;
      if (goldAcc >= 1) {
        gold += Math.floor(goldAcc);
        goldAcc -= Math.floor(goldAcc);
        updateHud();
      }
      spawnCd = Math.max(0, spawnCd - dt);
      enemyAi(dt);
      updateCastleAtk(dt);
      updateUnits(dt);
      updateProjectiles(dt);
      updateFx(dt);
      checkEnd();
      updateButtons();
    } else {
      updateFx(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  openPreBattle();
  requestAnimationFrame(loop);

</script>
</body>
