<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cat Clan v0.3.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="hud">
      <div id="hud-left">
        <div id="hp-wrap"><span id="hp-heart">❤️</span><div id="hp-bar"><div id="hp-fill"></div></div><span id="hp-text">40/40</span></div>
        <div id="lv-text">Lv.1</div>
      </div>
      <div id="hud-right">
        <div id="quest-hud"><span id="quest-icon">🐛</span> <span id="quest-text"></span></div>
      </div>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <div id="arrow" aria-hidden="true">➤</div>

    <div id="dialogue" class="hidden">
      <div id="dlg-avatar"></div>
      <div id="dlg-body">
        <p id="dlg-text"></p>
        <div id="dlg-actions">
          <button type="button" id="btn-replay" class="icon-btn" title="Replay">🔊</button>
          <button type="button" id="btn-next" class="big-btn">OK</button>
        </div>
      </div>
    </div>

    <div id="battle-ui" class="hidden">
      <div id="battle-telegraph">🦷</div>
      <div id="battle-status"></div>
      <div id="battle-btns">
        <button type="button" id="btn-claw" class="battle-btn"><span class="ico">🐾</span><span class="lbl" data-str="claw">CLAW</span></button>
        <button type="button" id="btn-pounce" class="battle-btn locked"><span class="ico">💥</span><span class="lbl" data-str="pounce">POUNCE</span><span class="lock">🔒</span></button>
        <button type="button" id="btn-groom" class="battle-btn locked"><span class="ico">🌿</span><span class="lbl" data-str="groom">GROOM</span><span class="lock">🔒</span></button>
      </div>
    </div>

    <div id="top-tools">
      <button type="button" id="btn-mute" class="icon-btn" title="Mute">🔇</button>
      <button type="button" id="btn-pause" class="icon-btn" title="Pause">⏸</button>
      <span id="ver">v0.3.0</span>
    </div>

    <div id="title-screen">
      <h1>Cat Clan</h1>
      <p class="sub">Tap to start!</p>
      <p class="ver">v0.3.0</p>
      <button type="button" id="btn-start" class="big-btn">New Game</button>
      <button type="button" id="btn-continue" class="big-btn hidden">Continue</button>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <h2>Pause</h2>
      <button type="button" id="btn-resume" class="big-btn">Continue</button>
      <button type="button" id="btn-restart" class="big-btn">New Game</button>
    </div>

    <div id="faint-screen" class="overlay hidden">
      <h2 id="faint-msg">Oops! Let's try again!</h2>
      <button type="button" id="btn-faint-ok" class="big-btn">Try again</button>
    </div>

    <div id="ending-screen" class="overlay hidden">
      <h2 id="end1">You are a hero!</h2>
      <p id="end2">The End... for now!</p>
      <button type="button" id="btn-end-restart" class="big-btn">New Game</button>
    </div>

    <div id="toast" class="hidden"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
